resident_unlock:
  fields:
    source:
      example: Garage keypad
      selector:
        text:
correct_entry:
  fields:
    entry_id:
      example: 3f9c1d0e5a7b4c2d8e6f0a1b2c3d4e5f
      selector:
        text:
    kind:
      required: true
      example: delivery
      selector:
        select:
          mode: dropdown
          translation_key: correction_kind
          options:
            - resident
            - delivery
            - visit
            - unknown
    guest_name:
      example: Alex
      selector:
        text:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    note:
      example: Neighbour dropped by
      selector:
        text:
add_visit:
  fields:
    guests:
      example: "Alex, Sam"
      selector:
        text:
          multiple: true
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    note:
      example: Coffee in the garden
      selector:
        text:
add_note:
  fields:
    entry_id:
      example: 3f9c1d0e5a7b4c2d8e6f0a1b2c3d4e5f
      selector:
        text:
    note:
      required: true
      example: Probably the postman
      selector:
        text:
export:
  fields:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
